# hostapd.conf para punto de acceso en wlan0 (AIC8800D80 / Fenvi FV-AX900Pro)
# 5 GHz canal 36 por defecto. Para 2.4 GHz: hw_mode=g y channel=6.
# La clave se ajusta en setup.sh (AP_PASS) y queda escrita aqui.
interface=wlan0
driver=nl80211
ssid=cachyos-x8664
hw_mode=a
channel=36
wmm_enabled=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=CHANGE_ME
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP